<style>
/* Design language after mayicestudio.com: #f5f5f5 ground, black ink, one
   regular-weight grotesk, a 12 column Swiss grid (wordmark in column 2,
   nav and footer words in columns 9 to 11), giant initials as navigation. */
:root{--g:#f5f5f5;--ink:#000;--f:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--g);color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{font:400 16px/1.25 var(--f);min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
main{flex:1 0 auto;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left}
em,i{font-style:italic}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
[tabindex="-1"]:focus-visible{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* plain words: links and buttons, underline on hover and focus only */
.w{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap;text-underline-offset:.18em;text-decoration-thickness:1px}
.w:hover,.w:focus-visible{text-decoration:underline}
.w[aria-current="page"]{font-style:italic}
.w:disabled{cursor:default;text-decoration:none}

/* 12 column grid, 8px outer padding, 16px gutters (as Mayice) */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px;padding:0 8px}
.c2{grid-column:2/9}
.right{grid-column:9/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px;align-items:baseline}
.right>*{justify-self:start}

/* header: wordmark top left, nav in the right third, fades into the page */
.top{position:sticky;top:0;z-index:5;height:72px;align-items:start;padding-top:2px;background:linear-gradient(180deg,var(--g) 62%,rgba(245,245,245,0))}
.mark{grid-column:2/8;font-style:italic;justify-self:start}

/* footer: small plain words in the right third */
.foot{padding:40px 8px 14px;align-items:baseline}
.foot .right span{min-height:44px;display:inline-flex;align-items:center;white-space:nowrap}

/* index: giant initials */
.index{justify-content:center;padding:6vh 0 4vh}
.letters{row-gap:8vw;align-items:start}
.item{grid-column:2/span 5;position:relative;transition:opacity .3s}
.item:nth-child(even){grid-column:7/span 5}
.big{display:inline-flex;align-items:baseline;font-size:6vw;line-height:1;letter-spacing:-.015em;white-space:nowrap}
.big .rest{display:inline-grid;grid-template-columns:0fr;transition:grid-template-columns .55s cubic-bezier(.2,.7,.2,1)}
.big .rest>span{min-width:0;overflow:hidden;overflow-x:clip;overflow-y:visible;white-space:pre}
.item:hover .rest,.letters:not(:has(.item:hover)) .big:focus-visible .rest{grid-template-columns:1fr}
.big:focus-visible{outline-offset:8px}
.item .meta{position:absolute;left:0;top:100%;margin-top:18px;max-width:34ch;font-size:15px;line-height:1.35;opacity:0;transition:opacity .3s}
.item:hover .meta,.item:focus-within .meta{opacity:1}
.letters:has(.item:hover) .item:not(:hover),.letters:has(.big:focus-visible):not(:has(.item:hover)) .item:not(:focus-within){opacity:0}

/* entry and notes hero */
.hero{padding-top:clamp(56px,16vh,190px);row-gap:28px}
.title{grid-column:2/-1;font-size:6vw;line-height:1;letter-spacing:-.015em;font-weight:400;overflow-wrap:anywhere}
.when{grid-column:2/4;font-size:16px;padding-top:13px}
.blurb{grid-column:4/9;font-size:16px;line-height:1.35;padding-top:13px;max-width:44ch}
.hero .right{align-items:start}

/* rendered markdown */
.md{margin-top:clamp(56px,14vh,160px);font-size:18px;line-height:1.5;align-items:start}
.md>*,.md .part>*{grid-column:2/9;max-width:65ch}
.md>*+*,.md .part>*+*{margin-top:1em}
.md .part{display:contents}
.md h1{font-size:clamp(26px,2.6vw,40px);line-height:1.12;font-weight:400;letter-spacing:-.01em;max-width:24em;margin-bottom:.4em}
.md .lede{font-size:18px;font-style:italic;margin-bottom:.4em}
.md h2{font-size:clamp(24px,2.2vw,34px);line-height:1.12;font-weight:400;letter-spacing:-.01em}
.md h3{font-size:18px;font-weight:400;font-style:italic;margin-top:2.2em}
.md .sec{grid-column:2/-1;max-width:none;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));column-gap:16px;align-items:baseline;margin-top:2.6em;scroll-margin-top:80px}
.md .sec h2{grid-column:1/8;max-width:24em}
.md .sec .w{grid-column:8;font-size:16px}
.md .sec .w+.w{grid-column:9}
.md .sec+*{margin-top:.8em}
.md strong{font-weight:600}
.md a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;overflow-wrap:anywhere}
.md a:hover{text-decoration-thickness:2px}
.md ul,.md ol{padding-left:1.35em}
.md li{padding-left:.15em}
.md li+li{margin-top:.45em}
.md li>ul,.md li>ol,.md li>p{margin-top:.45em}
.md li>p:first-child{margin-top:0}
.md blockquote{padding-left:2em}
.md blockquote>*+*{margin-top:1em}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.md pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;white-space:pre;overflow-x:auto;padding-left:2em}
.md hr{border:0;height:0;margin:2.5em 0}
.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.md th{font-weight:400;font-style:italic;text-align:left;padding:0 2.2em .5em 0;vertical-align:bottom}
.md td{padding:.3em 2.2em .3em 0;vertical-align:top}
.md th:last-child,.md td:last-child{padding-right:0}
.loading{font-size:16px}

/* editing: the section turns into its markdown source in place */
.state{grid-column:2/9;font-size:15px;line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;column-gap:1.4em}
.state:empty{display:none}
.state .w{font-size:15px}
.hist{margin-top:40px;font-size:16px}
.hist>*{grid-column:2/9}
.hrow{display:flex;flex-wrap:wrap;align-items:center;column-gap:1.6em;min-height:44px}
.hrow .n{opacity:.55}
.md .ed{grid-column:2/9;max-width:65ch;margin-top:2.6em;scroll-margin-top:80px}
.md>.ed:first-child{margin-top:0}
.ed .elabel{font-size:15px;line-height:1.35;font-style:italic;margin-bottom:12px}
.ed .field{font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.ed .acts{display:flex;gap:28px;margin-top:10px;font-size:16px}
.ed .small{margin-top:6px}
.ed .small:empty{display:none}

/* notes */
.notes{margin-top:clamp(80px,18vh,200px);align-items:start;font-size:18px;line-height:1.5}
.notes>.c2{max-width:65ch}
.allnotes .notes{margin-top:clamp(48px,9vh,110px)}
.nhead{grid-column:2/-1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));column-gap:16px;align-items:baseline}
.nhead h2{grid-column:1/8;font-size:clamp(24px,2.2vw,34px);line-height:1.12;font-weight:400;letter-spacing:-.01em}
.nhead .w{grid-column:8;font-size:16px}
.compose{margin-top:28px}
.field{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;color:var(--ink);font:400 18px/1.5 var(--f);padding:6px 0 8px;-webkit-appearance:none;appearance:none}
textarea.field{resize:none;overflow:hidden;min-height:calc(2 * 1.5em + 14px)}
.field::placeholder{color:#000;opacity:.42}
.field:focus-visible{outline:none;border-bottom-width:2px;padding-bottom:7px}
.notes .acts{margin-top:28px;font-size:16px}
.small{font-size:15px;line-height:1.35}
.status{grid-column:2/9;margin-top:10px;font-size:15px;line-height:1.35;min-height:1.35em}
.status:empty{display:none}
.list{grid-column:2/-1;margin-top:40px}
.note{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));column-gap:16px;align-items:start;padding:22px 0}
.note .nm{grid-column:1/8;font-size:15px;line-height:1.35;display:flex;flex-wrap:wrap;column-gap:1.4em;align-items:baseline}
.note .nm .w{min-height:0;padding:12px 0;margin:-12px 0}
.note .nt{grid-column:1/8;margin-top:6px;max-width:65ch;white-space:pre-wrap;overflow-wrap:anywhere}
.note .nt.field{max-width:65ch}
.note .na{grid-column:8/-1;grid-row:1/span 2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px;font-size:16px;margin-top:-13px}
.note .na>*{justify-self:start}
.note .ns{grid-column:1/8;margin-top:6px;font-size:15px}
.note .ns:empty{display:none}
.empty{font-size:16px}
.lock p{max-width:44ch}
.lock form{display:flex;align-items:flex-end;gap:28px;margin-top:22px;max-width:28rem}
.lock .field{flex:1;min-width:0}
.lock .w{font-size:16px}

@media (max-width:767px){
  .grid{display:block;padding:0 16px}
  .right{display:flex;flex-wrap:wrap;column-gap:22px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;height:68px;padding-top:6px}
  .mark{font-size:24px;line-height:1}
  .top .right{flex-wrap:nowrap}
  .foot{display:flex;justify-content:center;padding-top:48px}
  .foot .right{justify-content:center}
  .index{padding:0}
  .letters{display:flex;flex-direction:column;justify-content:space-evenly;flex:1;min-height:calc(100svh - 68px - 106px);padding:4vh 16px;text-align:center;gap:10vh}
  .item{opacity:1!important}
  .big{display:inline;font-size:11.43vw;line-height:1.05;white-space:normal;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
  .big .rest{display:inline;transition:none}
  .big .rest>span{overflow:visible;white-space:normal}
  .item .meta{position:static;opacity:1;margin:14px auto 0;max-width:30ch}
  .hero{display:flex;flex-direction:column;align-items:flex-start;row-gap:0;padding-top:28px}
  .title{font-size:11.43vw;line-height:1.05;-webkit-hyphens:auto;hyphens:auto}
  .when{padding-top:22px;font-size:15px}
  .blurb{padding-top:6px;font-size:15px}
  .hero .right{margin-top:10px}
  .md{display:block;margin-top:56px;font-size:17px}
  .md>*,.md .part>*{max-width:none}
  .md h1{font-size:25px}
  .md .lede{font-size:17px}
  .md h2{font-size:23px}
  .md .sec{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-top:2.4em}
  .md .sec .w{flex:none}
  .md .tw{margin-right:-16px;padding-right:16px}
  .md ul,.md ol{padding-left:1.2em}
  .md blockquote{padding-left:1.2em}
  .notes{display:block;margin-top:96px;font-size:17px}
  .allnotes .notes{margin-top:48px}
  .nhead{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
  .nhead h2{font-size:23px}
  .field{font-size:17px}
  .notes .acts{margin-top:14px}
  .status{margin-top:4px}
  .list{margin-top:28px}
  .note{display:block;padding:18px 0 6px}
  .note .na{display:flex;gap:26px;margin-top:2px}
  .lock form{gap:22px}
  .hrow{column-gap:1.1em}
}
@media (min-width:768px) and (max-width:1100px){
  .big,.title{font-size:8vw}
}
@media (min-width:768px) and (max-width:1240px){
  .hero .right{display:flex;flex-wrap:wrap;column-gap:24px}
}
@media (pointer:coarse){
  .md li a{padding:6px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
}
</style>

<body>
<header class="top grid">
  <a class="w mark" href="#/">Notepad</a>
  <nav class="right" aria-label="Site">
    <a class="w" id="nav-notes" href="#/notes">Notes</a>
    <button class="w" id="nav-key" type="button">Unlock</button>
  </nav>
</header>
<main id="main"><noscript><p class="grid"><span class="c2">This notepad needs JavaScript.</span></p></noscript></main>
<footer class="foot grid" id="foot"></footer>

<script>
(function(){
'use strict';

/* ---------- entries: drop a .md in notes/ and add one line here ---------- */
const ENTRIES = [
  {slug:'trivia-night', letter:'T', title:'Trivia night', date:'2026-10-09', file:'notes/trivia-night.md', blurb:'Settings, rules, tokens and resources for a 20 to 50 person quiz night in Bangalore'},
];

/* ---------- config ---------- */
const API_DEFAULT = 'https://claudenotepad.vaibhavpro9210.workers.dev';
const isLocal = hn => hn === 'localhost' || hn === '127.0.0.1';
// ?api= override only from a local page to a local worker, so a crafted
// link can never send the key anywhere else.
const API = (function(){
  try {
    const o = new URLSearchParams(location.search).get('api');
    if (o && isLocal(location.hostname)) {
      const u = new URL(o);
      if (isLocal(u.hostname) && /^https?:$/.test(u.protocol)) return u.origin;
    }
  } catch (e) {}
  return API_DEFAULT;
})();
const KEY = 'cnp.key';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MAXLEN = 20000;

/* ---------- storage (private mode safe) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} },
};

/* ---------- screenshot hook: #shot=index|entry|edit|history|notes, fake data, no API ---------- */
const SHOT = (location.hash.match(/^#shot=(index|entry|edit|history|notes)\b/) || [])[1] || null;
const FAKE = SHOT ? [
  {id:3, ts:new Date(2026,9,9,20,41).getTime(), entry:'trivia-night', edited:null,
   text:'Go with Board Exam Night. Admit cards as the confirmation email, recess after round 3.'},
  {id:2, ts:new Date(2026,9,9,19,5).getTime(), entry:'inbox', edited:new Date(2026,9,9,19,20).getTime(),
   text:'Chickpet, Sunday 7am:\n  brass bell for the rolling trophy\n  old 25 paisa coins, about 12\n  two Tinkle comics'},
  {id:1, ts:new Date(2026,9,8,22,14).getTime(), entry:'trivia-night', edited:null,
   text:'Ask the bar about a Wednesday. Pitch: a full room in exchange for the space and a pitcher for the winners.'},
] : null;
let fakeId = 3;
const FAKE_DOCS = [];
const MAXDOC = 200000;

/* ---------- key: capture #k= / &k= once, then scrub it from the URL ---------- */
function takeKey(){
  let hs = location.hash.slice(1);
  const m = hs.match(/(^|[&?])k=([^&]*)/);
  if (!m) return;
  let k = '';
  try { k = decodeURIComponent(m[2]).trim(); } catch (e) { k = m[2].trim(); }
  if (k && !SHOT) {
    const had = store.get(KEY);
    if (!had) store.set(KEY, k);
    else if (had !== k) {
      // A link must not silently swap out a working key: check it first.
      api('GET', '/notes', null, k).then(() => { store.set(KEY, k); render(); }, () => {});
    }
  }
  hs = hs.replace(/(^|[&?])k=[^&]*/, '').replace(/^[&?]+/, '');
  history.replaceState(null, '', location.pathname + location.search + '#' + (hs || '/'));
}
takeKey();
const getKey = () => SHOT ? 'shot' : (store.get(KEY) || '');

/* ---------- tiny DOM helper (text only, never innerHTML) ---------- */
function h(tag, props){
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(x => x != null && n.append(x));
    else n.append(c);
  }
  return n;
}
const word = (text, onclick, extra) => h('button', Object.assign({class:'w', type:'button', text, onclick}, extra || {}));

/* ---------- formatting ---------- */
function fmtTime(ms){
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : (iso || '');
}
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* ---------- clipboard with fallback, and the word swap ---------- */
async function copyText(t){
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  const ta = h('textarea', {readonly: true, 'aria-hidden': 'true', style: 'position:fixed;top:0;left:-9999px;opacity:0'});
  ta.value = t;
  document.body.append(ta);
  const act = document.activeElement;
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (act && act.focus) act.focus();
  return ok;
}
function swap(btn, text){
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; }, 1500);
}
async function copyWith(btn, getText){
  const t = getText();
  if (!t) { swap(btn, 'Nothing to copy'); return; }
  swap(btn, (await copyText(t)) ? 'Copied' : 'Copy failed');
}

/* ======================================================================
   Markdown: escape first, then inline markup. No raw HTML ever passes.
   ====================================================================== */
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(u){
  u = u.trim();
  if (/[\u0000- \\]/.test(u)) return null;
  if (/^https?:\/\//i.test(u)) return {href: u, ext: true};
  if (/^[a-z][a-z0-9+.-]*:/i.test(u) || u.slice(0, 2) === '//') return null;
  return {href: u, ext: false};
}
const RX_BOLD = /\*\*(?=\S)([\s\S]*?\S)\*\*/g, RX_BOLD_ = /__(?=\S)([\s\S]*?\S)__/g;
const RX_EM = /(^|[^*\w])\*([^\s*](?:[^*]*?[^\s*])?)\*(?![*\w])/g, RX_EM_ = /(^|[^\w])_([^\s_](?:[^_]*?[^\s_])?)_(?!\w)/g;
const RX_LINK = /\[([^\]]+)\]\(([^)\s]+)\)/g, RX_CODE = /`([^`]+)`/g;

function inline(raw){
  const slots = [];
  const put = x => '\u0000' + (slots.push(x) - 1) + '\u0000';
  let s = raw.replace(/\u0000/g, '');
  s = s.replace(RX_CODE, (m, c) => put('<code>' + esc(c) + '</code>'));
  s = s.replace(RX_LINK, (m, t, u) => {
    const L = safeUrl(u), inner = emph(esc(t));
    if (!L) return put(inner);
    return put('<a href="' + esc(L.href) + '"' + (L.ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + inner + '</a>');
  });
  s = emph(esc(s)).replace(/ {2,}\n/g, '<br>').replace(/\n/g, ' ');
  for (let g = 0; g < 4 && s.indexOf('\u0000') > -1; g++) s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => slots[+i]);
  return s;
}
function emph(s){
  return s.replace(RX_BOLD, '<strong>$1</strong>').replace(RX_BOLD_, '<strong>$1</strong>')
          .replace(RX_EM, '$1<em>$2</em>').replace(RX_EM_, '$1<em>$2</em>');
}
function inlineText(raw){
  const slots = [];
  const put = x => '\u0000' + (slots.push(x) - 1) + '\u0000';
  let s = raw.replace(/\u0000/g, '');
  s = s.replace(RX_CODE, (m, c) => put(c));
  s = s.replace(RX_LINK, (m, t, u) => {
    const tt = stripEmph(t), L = safeUrl(u);
    return put(L && L.ext && tt !== u ? tt + ' (' + u + ')' : tt);
  });
  s = stripEmph(s).replace(/ {2,}\n/g, '\n').replace(/\n/g, ' ');
  for (let g = 0; g < 4 && s.indexOf('\u0000') > -1; g++) s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => slots[+i]);
  return s;
}
const stripEmph = s => s.replace(RX_BOLD, '$1').replace(RX_BOLD_, '$1').replace(RX_EM, '$1$2').replace(RX_EM_, '$1$2');

const RX = {
  h: /^(#{1,6})[ \t]+(.*?)(?:[ \t]+#+)?[ \t]*$/,
  hr: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/,
  bq: /^ {0,3}>/,
  li: /^( {0,3})([-*+]|\d{1,9}[.)])[ \t]+(.*)$/,
  fence: /^ {0,3}(```|~~~)/,
  tsep: /^[ \t]*\|?[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/,
};
const blank = l => /^\s*$/.test(l);
const isTable = (L, i) => L[i].indexOf('|') > -1 && i + 1 < L.length && L[i + 1].indexOf('|') > -1 && RX.tsep.test(L[i + 1]);
const isStart = (L, i) => RX.h.test(L[i]) || RX.hr.test(L[i]) || RX.bq.test(L[i]) || RX.li.test(L[i]) || RX.fence.test(L[i]) || isTable(L, i);

function cells(line){
  let t = line.trim();
  if (t[0] === '|') t = t.slice(1);
  if (t.slice(-1) === '|' && t.slice(-2) !== '\\|') t = t.slice(0, -1);
  const out = []; let cur = '';
  for (let i = 0; i < t.length; i++) {
    if (t[i] === '\\' && t[i + 1] === '|') { cur += '|'; i++; }
    else if (t[i] === '|') { out.push(cur.trim()); cur = ''; }
    else cur += t[i];
  }
  out.push(cur.trim());
  return out;
}

/* Returns [html, plainText]. top=true marks H2 sections with a Copy word. */
function blocks(L, opt){
  opt = opt || {};
  const H = [], T = [];
  let i = 0;
  while (i < L.length) {
    const line = L[i];
    if (blank(line)) { i++; continue; }
    let m;
    if (RX.fence.test(line)) {
      const f = line.trim().slice(0, 3), buf = [];
      i++;
      while (i < L.length && L[i].trim().slice(0, 3) !== f) buf.push(L[i++]);
      i++;
      H.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); T.push(buf.join('\n'));
    } else if ((m = line.match(RX.h))) {
      const lv = Math.min(m[1].length, 3), body = inline(m[2]);
      if (opt.top && m[1].length === 2) {
        const n = opt.sec.n++;
        const nm = esc(inlineText(m[2]));
        H.push('<div class="sec" id="s' + n + '"><h2>' + body + '</h2><button class="w" type="button" data-sec="' + n + '" aria-label="Copy section: ' + nm + '">Copy</button>' +
          (opt.edit ? '<button class="w" type="button" data-edit="' + (n + 1) + '" aria-label="Edit section: ' + nm + '">Edit</button>' : '') + '</div>');
      } else if (opt.top && lv === 1 && !opt.sec.lede) {
        opt.sec.lede = true;
        H.push('<p class="lede">' + body + '</p>');
      } else H.push('<h' + lv + '>' + body + '</h' + lv + '>');
      T.push(inlineText(m[2]));
      i++;
    } else if (RX.hr.test(line)) {
      H.push('<hr>'); i++;
    } else if (isTable(L, i)) {
      const head = cells(L[i]);
      const al = cells(L[i + 1]).map(c => /^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : '');
      const rows = [];
      i += 2;
      while (i < L.length && !blank(L[i]) && L[i].indexOf('|') > -1) rows.push(cells(L[i++]));
      const td = (tag, c, k) => '<' + tag + (al[k] ? ' style="text-align:' + al[k] + '"' : '') + '>' + inline(c || '') + '</' + tag + '>';
      H.push('<div class="tw"><table><thead><tr>' + head.map((c, k) => td('th', c, k)).join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + head.map((x, k) => td('td', r[k], k)).join('') + '</tr>').join('') + '</tbody></table></div>');
      T.push([head].concat(rows).map(r => r.map(c => inlineText(c || '')).join('\t')).join('\n'));
    } else if (RX.bq.test(line)) {
      const buf = [];
      while (i < L.length && RX.bq.test(L[i])) buf.push(L[i++].replace(/^ {0,3}> ?/, ''));
      const r = blocks(buf);
      H.push('<blockquote>' + r[0] + '</blockquote>'); T.push(r[1]);
    } else if ((m = line.match(RX.li))) {
      const r = list(L, i); i = r.i; H.push(r.h); T.push(r.t);
    } else {
      const buf = [line];
      i++;
      while (i < L.length && !blank(L[i]) && !isStart(L, i)) buf.push(L[i++]);
      const src = buf.map(s => s.replace(/^ +/, '')).join('\n');
      H.push(opt.tight ? inline(src) : '<p>' + inline(src) + '</p>');
      T.push(inlineText(src));
    }
  }
  return [H.join(''), T.join(opt.tight ? '\n' : '\n\n')];
}

function list(L, i){
  const first = L[i].match(RX.li);
  const ordered = /\d/.test(first[2]);
  const start = ordered ? parseInt(first[2], 10) : 1;
  const items = [];
  let loose = false;
  while (i < L.length) {
    const m = L[i].match(RX.li);
    if (!m || m[1].length > 1 || /\d/.test(m[2]) !== ordered) break;
    const ci = m[1].length + m[2].length + 1;
    const body = [m[3]];
    i++;
    while (i < L.length) {
      const l = L[i];
      if (blank(l)) {
        let j = i; while (j < L.length && blank(L[j])) j++;
        if (j < L.length && /^ {2,}\S/.test(L[j])) { body.push(''); i = j; continue; }
        break;
      }
      const ind = l.match(/^ */)[0].length;
      if (ind >= 2) { body.push(l.slice(Math.min(ind, ci))); i++; continue; }
      if (isStart(L, i)) break;
      body.push(l); i++;
    }
    items.push(body);
    let j = i; while (j < L.length && blank(L[j])) j++;
    const n = j < L.length && L[j].match(RX.li);
    if (n && n[1].length <= 1 && /\d/.test(n[2]) === ordered) { if (j > i) loose = true; i = j; }
    else break;
  }
  const tag = ordered ? 'ol' : 'ul';
  let html = '<' + tag + (ordered && start !== 1 ? ' start="' + start + '"' : '') + '>';
  const text = [];
  items.forEach((body, k) => {
    const tight = !loose && body.indexOf('') < 0;
    const r = blocks(body, {tight});
    html += '<li>' + r[0] + '</li>';
    const mark = ordered ? (start + k) + '. ' : '• ';
    const pad = ' '.repeat(mark.length);
    text.push(r[1].split('\n').map((ln, x) => x === 0 ? mark + ln : (ln ? pad + ln : '')).join('\n'));
  });
  return {i, h: html + '</' + tag + '>', t: text.join(loose ? '\n\n' : '\n')};
}

/* Exact slices of the source: parts[0] is everything before the first H2
   (maybe empty), parts[n + 1] is H2 section n. parts.join('') === src. */
function splitParts(src){
  const starts = [0]; let fence = false, at = 0;
  src.split('\n').forEach(l => {
    if (RX.fence.test(l)) fence = !fence;
    else if (!fence && /^##[ \t]/.test(l)) starts.push(at);
    at += l.length + 1;
  });
  return starts.map((st, k) => src.slice(st, k + 1 < starts.length ? starts[k + 1] : src.length));
}
function renderMd(src, edit){
  const s = src.replace(/\r\n?/g, '\n'), parts = splitParts(s), sec = {n: 0}, H = [], T = [];
  parts.forEach((p, k) => {
    const r = blocks(p.split('\n'), {top: true, sec, edit});
    H.push('<div class="part" data-part="' + k + '">' + r[0] + '</div>');
    if (r[1]) T.push(r[1]);
  });
  return {html: H.join(''), text: T.join('\n\n').replace(/\n{3,}/g, '\n\n').trim() + '\n', parts,
          sections: parts.slice(1).map(p => p.replace(/\s+$/, ''))};
}

/* ======================================================================
   API client (key as Bearer). Shot mode answers from memory instead.
   ====================================================================== */
async function api(method, path, body, keyOverride){
  if (SHOT) return fakeApi(method, path, body);
  let r;
  try {
    r = await fetch(API + path, {
      method, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
      headers: Object.assign({'Authorization': 'Bearer ' + (keyOverride || getKey())}, body ? {'Content-Type': 'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { const err = new Error('net'); err.status = 0; throw err; }
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.error) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  return data;
}
function fakeApi(method, path, body){
  const q = new URLSearchParams(path.split('?')[1] || '');
  const id = +q.get('id');
  if (path.indexOf('/doc/versions') === 0) return Promise.resolve(FAKE_DOCS.map(d => ({id: d.id, ts: d.ts, len: d.text.length})).reverse());
  if (path.indexOf('/doc') === 0) {
    const last = FAKE_DOCS[FAKE_DOCS.length - 1] || null;
    if (method === 'GET') return Promise.resolve(id ? FAKE_DOCS.find(d => d.id === id) : last);
    if ((last ? last.id : 0) !== body.base) { const e = new Error('conflict'); e.status = 409; return Promise.reject(e); }
    const d = {id: FAKE_DOCS.length + 1, ts: Date.now(), entry: q.get('entry'), text: body.text.trim() + '\n'};
    FAKE_DOCS.push(d); return Promise.resolve(Object.assign({}, d));
  }
  if (method === 'GET') return Promise.resolve(FAKE.filter(n => !q.get('entry') || n.entry === q.get('entry')).map(n => Object.assign({}, n)));
  if (method === 'POST') { const n = {id: ++fakeId, ts: Date.now(), entry: body.entry, text: body.text, edited: null}; FAKE.unshift(n); return Promise.resolve(Object.assign({}, n)); }
  const n = FAKE.find(x => x.id === id);
  if (!n) { const e = new Error('not found'); e.status = 404; return Promise.reject(e); }
  if (method === 'PUT') { n.text = body.text; n.edited = Date.now(); return Promise.resolve(Object.assign({}, n)); }
  FAKE.splice(FAKE.indexOf(n), 1); return Promise.resolve({ok: true});
}
function errText(e){
  switch (e.status) {
    case 0: return 'Could not reach the notes server. Check the connection and try again.';
    case 401: return 'That key did not work.';
    case 404: return 'That note is gone.';
    case 413: return 'That note is too long.';
    case 429: return 'The notebook is full (5000 notes).';
    case 400: return 'The server refused that: ' + e.message + '.';
    default: return 'Something went wrong (' + (e.status || 'error') + '). Try again.';
  }
}
const asList = d => (Array.isArray(d) ? d : (d && d.notes) || []).slice().sort((a, b) => (b.ts - a.ts) || (b.id - a.id));

/* ======================================================================
   Notes panel: composer, list, edit, delete, copy all. Text via textContent.
   ====================================================================== */
let activePanel = null;

function notesPanel(opt){
  // opt: {entry: slug|null (null = every note), composeTo: slug, heading: bool}
  const root = h('section', {class: 'notes grid', id: 'notes', 'aria-label': 'Notes'});
  const status = h('p', {class: 'status', role: 'status', 'aria-live': 'polite'});
  const body = h('div', {class: 'c2'});
  const list = h('div', {class: 'list'});
  const draftKey = 'cnp.draft.' + opt.composeTo;
  let notes = [], editing = {}, loaded = false;
  const say = t => { status.textContent = t || ''; };

  const copyAllBtn = word('Copy all notes', () => copyWith(copyAllBtn, allText));
  if (opt.heading) root.append(h('div', {class: 'nhead'}, h('h2', {text: 'Notes'}), copyAllBtn));

  function allText(){
    return notes.slice().reverse().map(n => {
      let head = fmtTime(n.ts);
      if (!opt.entry) head += ' (' + entryName(n.entry) + ')';
      return head + '\n' + n.text;
    }).join('\n\n');
  }

  function lockedView(msg){
    loaded = false; notes = [];
    body.replaceChildren(); list.replaceChildren(); say('');
    const input = h('input', {class: 'field', id: 'key', type: 'password', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', placeholder: 'Key', 'aria-label': 'Key'});
    const btn = h('button', {class: 'w', type: 'submit', text: 'Unlock'});
    const err = h('p', {class: 'small', role: 'alert', style: 'margin-top:12px'});
    if (msg) err.textContent = msg;
    const form = h('form', {onsubmit: async ev => {
      ev.preventDefault();
      const k = input.value.trim();
      if (!k) { input.focus(); return; }
      btn.disabled = true; btn.textContent = 'Checking'; err.textContent = '';
      try {
        const d = await api('GET', '/notes', null, k);
        store.set(KEY, k);
        updateNav();
        if (activeEntry) activeEntry.refresh();
        // GET /notes returns every entry; an entry page reloads with ?entry=.
        if (opt.entry) loaded = false; else { notes = asList(d); loaded = true; }
        unlockedView();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Unlock';
        err.textContent = e.status === 401 ? 'That key did not work.' : errText(e);
        input.select();
      }
    }}, input, btn);
    body.append(h('div', {class: 'lock'}, h('p', {text: 'Notes are locked on this device.'}), form, err));
  }

  function unlockedView(){
    body.replaceChildren();
    const ta = h('textarea', {class: 'field', rows: '3', placeholder: 'Write a note to relay later', 'aria-label': 'New note', maxlength: String(MAXLEN)});
    if (!SHOT) ta.value = store.get(draftKey) || '';
    const save = word('Save', submit, {title: 'Save (Cmd or Ctrl + Enter)'});
    ta.addEventListener('input', () => {
      grow(ta);
      if (!SHOT) ta.value ? store.set(draftKey, ta.value) : store.del(draftKey);
    });
    ta.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); submit(); } });
    async function submit(){
      const text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      if (text.length > MAXLEN) { say('Notes are limited to 20000 characters.'); return; }
      save.disabled = true; save.textContent = 'Saving'; say('');
      try {
        const n = await api('POST', '/notes', {entry: opt.composeTo, text});
        ta.value = ''; grow(ta); store.del(draftKey);
        notes.unshift(n); drawList();
        save.textContent = 'Saved';
        setTimeout(() => { save.textContent = 'Save'; }, 1500);
      } catch (e) {
        save.textContent = 'Save';
        if (e.status === 401) return expired();
        say(errText(e));
      } finally { save.disabled = false; }
    }
    body.append(h('div', {class: 'compose'}, ta), h('div', {class: 'acts'}, save));
    requestAnimationFrame(() => grow(ta));
    grow(ta);
    if (loaded) drawList(); else load();
  }

  async function load(){
    list.replaceChildren(h('p', {class: 'empty', text: 'Loading notes'}));
    try {
      notes = asList(await api('GET', '/notes' + (opt.entry ? '?entry=' + encodeURIComponent(opt.entry) : '')));
      loaded = true; drawList();
    } catch (e) {
      if (e.status === 401) return expired();
      list.replaceChildren(h('p', {class: 'empty'}, errText(e) + ' ', word('Retry', load)));
    }
  }

    // A panel replaced mid-request (route change, or a #k= key just verified) must not drop the new key.

    store.del(KEY); updateNav();

  }

  function drawList(){

    list.replaceChildren(...notes.map(noteView));
  }

  function noteView(n){
    const meta = h('div', {class: 'nm'}, h('time', {datetime: new Date(n.ts).toISOString(), text: fmtTime(n.ts)}));
    if (n.edited) meta.append(h('em', {text: 'edited'}));
    if (!opt.entry) {
      const e = ENTRIES.find(x => x.slug === n.entry);
      meta.append(e ? h('a', {class: 'w', href: '#/' + e.slug, text: e.title}) : h('span', {text: entryName(n.entry)}));
    }
    const ns = h('p', {class: 'ns', role: 'alert'});

    if (n.id in editing) {
      const ta = h('textarea', {class: 'field nt', 'aria-label': 'Edit note', maxlength: String(MAXLEN)});
      ta.value = editing[n.id];

      ta.addEventListener('input', () => { editing[n.id] = ta.value; grow(ta); });
      ta.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); doSave(); }
        if (ev.key === 'Escape') { ev.preventDefault(); cancel.click(); }
      });
      async function doSave(){

        if (text.length > MAXLEN) { ns.textContent = 'Notes are limited to 20000 characters.'; return; }
        sv.disabled = true; sv.textContent = 'Saving'; ns.textContent = '';

      const ed = word('Edit', () => { editing[n.id] = n.text; drawList(); const f = list.querySelector('[data-id="' + n.id + '"] textarea'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, {'aria-label': 'Edit note from ' + fmtTime(n.ts)});

  }

  root.append(body, status, list);
  activePanel = {root, copyAll: btn => copyWith(btn, allText), focusKey: () => { const k = root.querySelector('#key'); if (k) { k.scrollIntoView({block: 'center'}); k.focus(); } return !!k; }, relock: () => lockedView()};

  const hist = h('div', {class: 'hist grid', hidden: true});
  const acts = h('div', {class: 'right'});
  const copyAll = word('Copy all', () => copyWith(copyAll, () => st.text));
  const copyTxt = word('Copy as text', () => copyWith(copyTxt, () => st.r && st.r.text));
  const editAll = word('Edit all', () => openEditor(-1));
  const histW = word('History', toggleHistory, {'aria-expanded': 'false'});
  const raw = () => h('a', {class: 'w', href: e.file, target: '_blank', rel: 'noopener'}, 'Raw');
  const hero = h('header', {class: 'hero grid'},
    h('h1', {class: 'title', tabindex: '-1', text: e.title}),
    h('p', {class: 'when'}, h('time', {datetime: e.date, text: fmtDate(e.date)})),
    h('p', {class: 'blurb', text: e.blurb}),
    acts, state);

  const readDraft = () => { try { return SHOT ? null : JSON.parse(store.get(draftKey)); } catch (x) { return null; } };
  const writeDraft = d => { if (!SHOT) store.set(draftKey, JSON.stringify(d)); };
  const clearDraft = () => store.del(draftKey);
  const firstLine = t => t.split('\n')[0];
  const partOf = id => id === '#all' ? -1 : st.r.parts.findIndex((p, k) => k > 0 && firstLine(p) === id);

  article.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-sec],button[data-edit]');
    if (!b || !st.r) return;
    if (b.dataset.edit) openEditor(+b.dataset.edit);
    else copyWith(b, () => st.r.sections[+b.dataset.sec]);
  });

  async function load(){
    let md;
    try {
      const r = await fetch(e.file, {cache: 'no-cache'});
      if (!r.ok) throw new Error(r.status);
      md = await r.text();
    } catch (x) {
      if (activeEntry !== me) return;
      article.replaceChildren(h('p', {}, 'Could not load this entry. ', h('a', {href: e.file, text: 'Open the raw file'}), '.'));
      return;
    }
    let d = null, why = getKey() ? '' : 'locked';
    if (!why) {
      try { d = await api('GET', '/doc?entry=' + e.slug); }
      catch (x) { why = x.status === 401 ? 'locked' : 'failed'; }
    }
    if (activeEntry !== me) return;
    st.orig = md; st.editable = !why;
    st.text = d ? d.text : md; st.base = d ? d.id : 0; st.ts = d ? d.ts : null;
    draw(why);
    if (SHOT === 'edit') openEditor(2);
    if (SHOT === 'history' && !FAKE_DOCS.length) {
      await api('PUT', '/doc?entry=' + e.slug, {text: md, base: 0});
      await api('PUT', '/doc?entry=' + e.slug, {text: md, base: 1});
      await load(); toggleHistory();
    }
  }

  function draw(why){
    st.r = renderMd(st.text, st.editable); st.open = null;
    article.innerHTML = st.r.html;
    acts.replaceChildren(...(st.editable ? [copyAll, copyTxt, editAll, histW] : [copyAll, copyTxt, raw()]));
    if (!st.editable) { hist.hidden = true; histW.setAttribute('aria-expanded', 'false'); }
    const bits = [];
    if (why === 'locked') bits.push('Unlock to edit this page.');
    else if (why === 'failed') bits.push('Could not load your edits, so this is the original and editing is off.', word('Retry', load));
    else if (st.ts) bits.push('Your edited version, saved ' + fmtTime(st.ts) + '.');
    const dr = st.editable && readDraft();
    if (dr && dr.text) {
      const k = partOf(dr.id);
      bits.push('You have an unsaved edit' + (dr.id === '#all' ? '' : ' to ' + dr.id.replace(/^#+\s*/, '')) + '.');
      if (k > -1 || dr.id === '#all') bits.push(word('Resume', () => openEditor(k)));
      else bits.push(word('Copy it', function(){ copyWith(this, () => dr.text); }));
      bits.push(word('Discard', () => { if (confirm('Discard the unsaved edit?')) { clearDraft(); draw(); } }));
    }
    state.replaceChildren(...bits.map(b => typeof b === 'string' ? h('span', {text: b}) : b));
  }

  function openEditor(k){
    if (!st.editable || !st.r) return;
    if (st.open) {
      if (st.open.dirty() && !confirm('Discard the edit you have open?')) return;
      draw();
    }
    const orig = k < 0 ? st.text : st.r.parts[k];
    const body = orig.replace(/\s+$/, '');
    const trail = k < 0 ? '\n' : (orig.slice(body.length) || '\n\n');
    const id = k < 0 ? '#all' : firstLine(orig);
    const dr = readDraft();
    const ta = h('textarea', {class: 'field', 'aria-label': k < 0 ? 'Edit the whole page (markdown)' : 'Edit section (markdown)', autocapitalize: 'sentences'});
    ta.value = dr && dr.id === id ? dr.text : body;
    const msg = h('p', {class: 'small', role: 'status'});
    if (dr && dr.id === id && dr.text !== body) msg.textContent = 'Restored your unsaved edit.';
    const sv = word('Save', save, {title: 'Save (Cmd or Ctrl + Enter)'});
    const cancel = word('Cancel', () => {
      if (ta.value !== body && !confirm('Discard your changes?')) return;
      clearDraft(); draw(); focusEdit(k);
    });
    const label = h('p', {class: 'elabel', text: (k < 0 ? 'Editing the whole page' : 'Editing this section') + ', in markdown: ## heading, **bold**, *italic*, - list, | table |'});
    const ed = h('div', {class: 'ed'}, label, ta, h('div', {class: 'acts'}, sv, cancel), msg);
    ta.addEventListener('input', () => { grow(ta); ta.value === body ? clearDraft() : writeDraft({id, text: ta.value}); });
    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); save(); }
      if (ev.key === 'Escape') { ev.preventDefault(); cancel.click(); }
    });
    if (k < 0) article.replaceChildren(ed);
    else article.querySelector('[data-part="' + k + '"]').replaceChildren(ed);
    st.open = {dirty: () => ta.value !== body};
    grow(ta);
    if (!SHOT) { ta.focus({preventScroll: true}); ed.scrollIntoView({block: 'start'}); }

    async function save(){
      const v = ta.value.replace(/\s+$/, '');
      if (k < 0 && !v.trim()) { msg.textContent = 'The page cannot be empty.'; return; }
      if (k >= 0 && !v.trim() && !confirm('Remove this whole section?')) return;
      let next;
      if (k < 0) next = v + '\n';
      else { const parts = st.r.parts.slice(); parts[k] = v ? v + trail : ''; next = parts.join(''); }
      if (!next.trim()) { msg.textContent = 'The page cannot be empty.'; return; }
      if (next.length > MAXDOC) { msg.textContent = 'That is too long (200000 characters max).'; return; }
      if (next === st.text) { clearDraft(); draw(); focusEdit(k); return; }
      sv.disabled = true; sv.textContent = 'Saving'; msg.textContent = '';
      try {
        const d = await api('PUT', '/doc?entry=' + e.slug, {text: next, base: st.base});
        st.text = d.text; st.base = d.id; st.ts = d.ts;
        clearDraft(); draw(); focusEdit(k);
        if (!hist.hidden) loadHistory();
      } catch (x) {
        sv.disabled = false; sv.textContent = 'Save';
        const kept = ' Your edit is kept on this device.';
        if (x.status === 409) msg.replaceChildren('This page changed on another device.' + kept + ' ', word('Load latest', load));
        else if (x.status === 401) msg.textContent = 'That key did not work.' + kept;
        else if (x.status === 0) msg.textContent = 'Could not reach the server.' + kept;
        else msg.textContent = 'The server refused that (' + x.message + ').' + kept;
      }
    }
  }
  function focusEdit(k){
    const b = k < 0 ? editAll : article.querySelector('[data-edit="' + k + '"]');
    if (b && b.isConnected) { if (!SHOT) b.scrollIntoView({block: 'center'}); b.focus({preventScroll: true}); }
  }

  async function toggleHistory(){
    const open = hist.hidden;
    hist.hidden = !open; histW.setAttribute('aria-expanded', String(open));
    if (open) loadHistory();
  }
  async function loadHistory(){
    hist.replaceChildren(h('p', {class: 'hrow', text: 'Loading versions'}));
    let v;
    try { v = await api('GET', '/doc/versions?entry=' + e.slug); }
    catch (x) { hist.replaceChildren(h('p', {class: 'hrow'}, 'Could not load the history. ', word('Retry', loadHistory))); return; }
    const row = (when, size, id) => h('div', {class: 'hrow'}, h('span', {text: when}), h('span', {class: 'n', text: size}),
      id === st.base ? h('em', {text: 'showing'}) : word('Restore', () => restore(id), {'aria-label': 'Restore the version from ' + when}));
    const chars = n => n.toLocaleString('en-IN') + ' characters';
    hist.replaceChildren(
      ...v.map(x => row(fmtTime(x.ts), chars(x.len), x.id)),
      h('div', {class: 'hrow'}, h('span', {text: 'Original'}), h('span', {class: 'n', text: chars(st.orig.length)}),
        st.base === 0 ? h('em', {text: 'showing'}) : word('Restore', () => restore(0), {'aria-label': 'Restore the original'}), raw()),
      h('p', {class: 'hrow n', text: v.length ? 'The last 100 saves are kept. Restoring saves a new version, so nothing is lost.' : 'No edits yet.'}));
  }
  async function restore(id){
    if (!confirm('Show this version again? The current one stays in History.')) return;
    try {
      const text = id ? (await api('GET', '/doc?entry=' + e.slug + '&id=' + id)).text : st.orig;
      const d = await api('PUT', '/doc?entry=' + e.slug, {text, base: st.base});
      st.text = d.text; st.base = d.id; st.ts = d.ts;
      draw(); loadHistory();
    } catch (x) {
      hist.prepend(h('p', {class: 'hrow', role: 'alert', text: x.status === 409 ? 'This page changed on another device. Reload, then try again.' : 'Could not restore that version (' + (x.status || 'offline') + ').'}));
    }
  }

  me.refresh = load;
  activeEntry = me;
  main.className = 'entry';
  main.replaceChildren(hero, hist, article, notesPanel({entry: e.slug, composeTo: e.slug, heading: true}).root);
  footer([h('a', {class: 'w', href: '#/', text: 'Index'}), toTop()]);
  load();
  return e.title + ' · Notepad';
}

function viewNotes(){
  const panel = notesPanel({entry: null, composeTo: 'inbox', heading: false});
  const cp = word('Copy all notes', () => panel.copyAll(cp));
  const hero = h('header', {class: 'hero grid'},
    h('h1', {class: 'title', tabindex: '-1', text: 'Notes'}),
    h('p', {class: 'when', text: 'All entries'}),
    h('p', {class: 'blurb', text: 'Every note in one place. New notes written here go to the inbox.'}),
    h('div', {class: 'right'}, cp));
  main.className = 'allnotes';
  main.replaceChildren(hero, panel.root);
  footer([h('a', {class: 'w', href: '#/', text: 'Index'}), toTop()]);
  return 'Notes · Notepad';
}

function route(){
  if (SHOT && !route.done) return {v: SHOT === 'index' || SHOT === 'notes' ? SHOT : 'entry', e: ENTRIES[0]};
  const p = location.hash.replace(/^#\/?/, '').split(/[&?]/)[0];
  if (p === 'notes') return {v: 'notes'};
  const e = ENTRIES.find(x => x.slug === p);
  return e ? {v: 'entry', e} : {v: 'index'};
}
function render(){
  const r = route(); route.done = true;
  activePanel = null; activeEntry = null;
  document.title = r.v === 'entry' ? viewEntry(r.e) : r.v === 'notes' ? viewNotes() : viewIndex();
  if (r.v === 'notes') navNotes.setAttribute('aria-current', 'page'); else navNotes.removeAttribute('aria-current');
  main.querySelectorAll('textarea').forEach(grow);
  updateNav();
  window.scrollTo(0, 0);
  const t = main.querySelector('.title');
  if (wantKeyFocus && activePanel) { wantKeyFocus = false; activePanel.focusKey(); }
  else if (t && render.ran) t.focus({preventScroll: true});
  render.ran = true;
}
window.addEventListener('hashchange', () => { takeKey(); render(); });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
render();
})();
</script>
<script>
/* anonymous visit beacon: counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
