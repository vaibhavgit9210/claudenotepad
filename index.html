<style>
:root{
  --bg:#141413; --fg:#e8e6dc; --dim:#8b8a85; --faint:#55544f; --acc:#d97757;
  --code:#b1b9f9; --ubg:#262624; --line:#3d3d3a; --ok:#78c38a; --err:#e06c6c;
  --mark:rgba(217,119,87,.16);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.6 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  -webkit-text-size-adjust:100%}
::selection{background:#5a4436}
a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
a:hover{text-decoration-color:var(--fg)}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 0}

/* welcome box, like the Claude Code banner */
.welcome{border:1px solid var(--acc);border-radius:8px;padding:10px 14px;margin-bottom:22px}
.welcome b{font-weight:600}
.welcome .acc{color:var(--acc)}
.welcome .d{color:var(--dim)}

/* feed */
.m{position:relative;margin:0 0 18px}
.m .t{position:absolute;right:0;top:-1px;color:var(--faint);font-size:12px;opacity:0;transition:opacity .15s;
  background:var(--bg);padding-left:8px}
.m:hover .t{opacity:1}
.u{background:var(--ubg);padding:2px 10px 2px 0;display:flex}
.u .p{color:var(--dim);flex:0 0 2ch;text-align:right;margin-right:1ch}
.u .body{white-space:pre-wrap;word-break:break-word;flex:1}
.n .p{color:var(--acc)}
.res{color:var(--dim);padding-left:2ch}
.c{display:flex}
.c .p{flex:0 0 2ch;color:var(--fg)}
.c .body{flex:1;min-width:0;word-break:break-word}
.body > :last-child{margin-bottom:0}
.blk{margin:0 0 .9em}
.hd{font-weight:700}
.h1{text-decoration:underline;text-underline-offset:3px}
.body strong{font-weight:700}
.body em{font-style:italic}
.body code{color:var(--code)}
.body pre{margin:0 0 .9em;padding:8px 12px;border:1px solid var(--line);border-radius:6px;overflow-x:auto;white-space:pre}
.body pre code{color:var(--fg)}
.li{display:flex;margin:0 0 .15em}
.li .mk{flex:0 0 auto;white-space:pre;color:var(--fg)}
.li .lc{flex:1;min-width:0}
.lst{margin:0 0 .9em}
.lst .lst{margin:.15em 0 0}
.bq{border-left:2px solid var(--line);padding-left:12px;color:var(--dim)}
.hr{border-top:1px solid var(--line);margin:0 0 .9em;height:0}
.tbl{overflow-x:auto;margin:0 0 .9em}
.tbl table{border-collapse:collapse}
.tbl td,.tbl th{border:1px solid var(--line);padding:2px 10px;text-align:left;vertical-align:top}
.tbl th{font-weight:700}

/* comments */
mark{background:var(--mark);color:inherit;border-bottom:1px dotted var(--acc);cursor:help}
mark.on{background:rgba(217,119,87,.32)}
.orph{color:var(--dim);padding-left:2ch;font-size:13px}
.pop{position:fixed;z-index:30;max-width:min(420px,calc(100vw - 20px));background:#1f1f1d;
  border:1px solid var(--acc);border-radius:8px;padding:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.5);font-size:13px}
.pop .txt{white-space:pre-wrap;word-break:break-word}
.pop .meta{color:var(--dim);margin-top:6px;font-size:12px}
.pop .q{color:var(--dim);font-size:12px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop textarea{width:min(380px,calc(100vw - 44px));min-height:4.8em;resize:vertical;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:4px;font:inherit;padding:6px 8px;outline:none}
.pop textarea:focus{border-color:var(--dim)}
.lk{color:var(--fg);cursor:pointer;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px;
  background:none;border:0;padding:0;font:inherit}
.lk:hover{text-decoration-color:var(--fg)}
.lk.err{color:var(--err)}
#addc{position:absolute;z-index:25;background:var(--acc);color:#141413;border:0;border-radius:5px;padding:3px 9px;
  font:600 12px/1.4 ui-monospace,Menlo,monospace;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}

/* bottom input, like the CLI prompt box */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:20;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.dock .in{max-width:980px;margin:0 auto;padding:0 18px}
.box{display:flex;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.box:focus-within{border-color:var(--dim)}
.box .p{color:var(--fg);flex:0 0 2ch}
.box textarea{flex:1;background:transparent;border:0;outline:none;color:var(--fg);font:inherit;resize:none;
  padding:0;margin:0;line-height:1.6;max-height:40vh;overflow-y:auto}
.box textarea::placeholder{color:var(--faint)}
.box textarea.secret{-webkit-text-security:disc}
.hint{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;padding:4px 2px 0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
.sys{color:var(--dim)} .sys.err{color:var(--err)}

@media (max-width:600px){
  body{font-size:13px}
  .wrap{padding:12px 12px 0}
  .dock .in{padding:0 10px}
  .box textarea{font-size:16px}
  .hint .long{display:none}
  .m .t{display:none}
}

<body>
<div class="wrap">
  <div class="welcome">
    <div><span class="acc">✻</span> <b>Welcome to claudenotepad</b></div>
    <div class="d">&nbsp;&nbsp;the information terminal between Claude Code and this page</div>
    <div class="d">&nbsp;&nbsp;cwd: ~/Documents/personal/me</div>
  </div>
  <div id="feed"></div>
</div>
<div class="dock"><div class="in">
  <div class="box"><span class="p">&gt;</span><textarea id="inp" rows="1" spellcheck="false" autocomplete="off" aria-label="input"></textarea></div>
  <div class="hint"><span><span class="long">enter to add · shift+enter newline · select any text to comment · /lock</span><span class="short"></span></span><span><span class="dot" id="dot"></span><span id="st">offline</span></span></div>
</div></div>
<script>
(function(){
'use strict';

/* ---------- config ---------- */
const API_DEFAULT = 'https://claudenotepad.vaibhavpro9210.workers.dev';
const isLocal = hn => hn === 'localhost' || hn === '127.0.0.1';
// ?api= override only from a local page to a local worker, so a crafted
// link can never send the key anywhere else.
const API = (function(){
  try {
    const o = new URLSearchParams(location.search).get('api');
    if (o && isLocal(location.hostname)) {
      const u = new URL(o);
      if (isLocal(u.hostname) && /^https?:$/.test(u.protocol)) return u.origin;
    }
  } catch (e) {}
  return API_DEFAULT;
})();
const KEY = 'cnp.key', DRAFT = 'cnp.draft', POLL_MS = 4000;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} },
};

/* ---------- screenshot hook: #shot=feed|comment|locked, fake data, no API ---------- */
const SHOT = (location.hash.match(/^#shot=(feed|comment|locked)\b/) || [])[1] || null;
const T0 = new Date(2026, 9, 14, 13, 2).getTime();
let FAKE = SHOT ? {rev: 1, msgs: [
  {id:1, ts:T0, kind:'user', edited:null, text:'what is a good way to learn how databases work?'},
  {id:2, ts:T0 + 60000, kind:'claude', edited:null, text:
    'Build a tiny one. You learn more from **one working B-tree** than from ten chapters.\n\n' +
    '## Where to start\n- **CMU 15-445** (free lectures, with `bustub` as the project)\n- **Database Internals**, the book, parts I and II\n' +
    '  - read with a notebook open\n\n## My pick\n1. Write a key-value store with a log.\n2. Add an index.\n3. Then read the paper the [SQLite docs](https://sqlite.org/arch.html) point to.'},
  {id:3, ts:T0 + 300000, kind:'note', edited:null, text:'start bustub this weekend\nask about the buffer pool lab'},
], comments: [
  {id:1, ts:T0 + 200000, msg:2, start:0, end:13, quote:'Build a tiny ', text:'agreed, doing this first', edited:null},
  {id:2, ts:T0 + 220000, msg:2, start:0, end:0, quote:'', text:'', edited:null},
]} : null;
if (FAKE) { // anchor the second fake comment by searching, so the offsets stay honest
  const c = FAKE.comments[1]; c.quote = 'one working B-tree'; c.text = 'which language though?\nprobably Go';
}
let fakeId = 100;

/* ---------- key: capture #k= once, then scrub it from the URL ---------- */
(function takeKey(){
  const m = location.hash.match(/(^#|[&?])k=([^&]*)/);
  if (!m) return;
  let k = '';
  try { k = decodeURIComponent(m[2]).trim(); } catch (e) { k = m[2].trim(); }
  if (k && !SHOT) {
    const had = store.get(KEY);
    if (!had) store.set(KEY, k);
    else if (had !== k) // a link must not silently swap out a working key: check it first
      api('GET', '/feed', null, k).then(() => { store.set(KEY, k); poll(true); }, () => {});
  }
  history.replaceState(null, '', location.pathname + location.search);
})();
const getKey = () => SHOT === 'locked' ? '' : SHOT ? 'shot' : (store.get(KEY) || '');

/* ---------- api ---------- */
async function api(method, path, body, keyOverride){
  if (SHOT) return fakeApi(method, path, body);
  const r = await fetch(API + path, {
    method, cache: 'no-store',
    headers: Object.assign({'Authorization': 'Bearer ' + (keyOverride || getKey())},
      body ? {'Content-Type': 'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((data && data.error) || ('http ' + r.status)); e.status = r.status; throw e; }
  return data;
}
function fakeApi(method, path, body){
  const id = Number((path.match(/id=(\d+)/) || [])[1]);
  const now = Date.now();
  FAKE.rev++;
  if (path.startsWith('/feed')) { FAKE.rev--; return Promise.resolve(JSON.parse(JSON.stringify(FAKE))); }
  if (path === '/msg' && method === 'POST') FAKE.msgs.push({id: ++fakeId, ts: now, kind: body.kind, text: body.text, edited: null});
  if (path === '/comment' && method === 'POST') FAKE.comments.push(Object.assign({id: ++fakeId, ts: now, edited: null}, body));
  if (path.startsWith('/comment?') && method === 'PUT') FAKE.comments.forEach(c => { if (c.id === id) { c.text = body.text; c.edited = now; } });
  if (path.startsWith('/comment?') && method === 'DELETE') FAKE.comments = FAKE.comments.filter(c => c.id !== id);
  return Promise.resolve({ok: true});
}

/* ---------- tiny DOM helper (text only, never innerHTML) ---------- */
function h(tag, props, kids){
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  if (kids) for (const c of kids) if (c != null) n.append(c);
  return n;
}
function when(ms){
  const d = new Date(ms), p = x => String(x).padStart(2, '0');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- markdown, built as DOM nodes ---------- */
function safeHref(u){
  try {
    const x = new URL(u, location.href);
    return /^(https?|mailto):$/.test(x.protocol) ? x.href : null;
  } catch (e) { return null; }
}
const RX_IN = new RegExp([
  '`([^`\\n]+)`',                                   // 1 code
  '\\*\\*(?=\\S)([\\s\\S]*?\\S)\\*\\*',             // 2 bold
  '\\[([^\\]\\n]+)\\]\\(([^)\\s]+)\\)',             // 3,4 link
  '(https?:\\/\\/[^\\s<>()]*[^\\s<>().,;:!?\'"])',  // 5 bare url
  '(^|[^\\w*])\\*(?=\\S)([^*\\n]*?\\S)\\*(?![\\w*])', // 6,7 em
  '(^|[^\\w])_(?=\\S)([^_\\n]*?\\S)_(?!\\w)',       // 8,9 em
].join('|'), 'g');
function inline(s, into){
  const re = new RegExp(RX_IN.source, 'g');
  let last = 0, m;
  const link = (text, href) => {
    const u = safeHref(href);
    if (!u) { inline(text, into); return; }
    const a = h('a', {href: u, target: '_blank', rel: 'noopener noreferrer'});
    inline(text, a); into.append(a);
  };
  while ((m = re.exec(s))) {
    into.append(s.slice(last, m.index));
    if (m[1] != null) into.append(h('code', {text: m[1]}));
    else if (m[2] != null) { const b = h('strong'); inline(m[2], b); into.append(b); }
    else if (m[3] != null) link(m[3], m[4]);
    else if (m[5] != null) link(m[5], m[5]);
    else {
      const pre = m[6] != null ? m[6] : m[8], inner = m[6] != null ? m[7] : m[9];
      into.append(pre);
      const e = h('em'); inline(inner, e); into.append(e);
    }
    last = re.lastIndex;
  }
  into.append(s.slice(last));
  return into;
}
const RX_LI = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;
const RX_FENCE = /^\s*(```|~~~)/;
const RX_HD = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
const RX_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
const isTableSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

function blocks(src, into){
  const L = src.replace(/\r\n?/g, '\n').split('\n');
  let i = 0;
  const startsBlock = l => RX_FENCE.test(l) || RX_HD.test(l) || RX_HR.test(l) || RX_LI.test(l) || /^\s*>/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (RX_FENCE.test(l)) {
      const fence = l.trim().slice(0, 3), code = [];
      i++;
      while (i < L.length && !L[i].trim().startsWith(fence)) code.push(L[i++]);
      i++;
      into.append(h('pre', null, [h('code', {text: code.join('\n')})]));
      continue;
    }
    let m;
    if ((m = RX_HD.exec(l))) {
      into.append(inline(m[2], h('div', {class: 'blk hd' + (m[1].length === 1 ? ' h1' : '')})));
      i++; continue;
    }
    if (RX_HR.test(l)) { into.append(h('div', {class: 'hr'})); i++; continue; }
    if (l.includes('|') && i + 1 < L.length && isTableSep(L[i + 1])) {
      const head = cells(l), rows = [];
      i += 2;
      while (i < L.length && L[i].includes('|') && L[i].trim()) rows.push(cells(L[i++]));
      const t = h('table', null, [h('tr', null, head.map(c => inline(c, h('th'))))]);
      rows.forEach(r => t.append(h('tr', null, head.map((_, j) => inline(r[j] || '', h('td'))))));
      into.append(h('div', {class: 'tbl'}, [t]));
      continue;
    }
    if (/^\s*>/.test(l)) {
      const q = [];
      while (i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, ''));
      const d = h('div', {class: 'blk bq'}); blocks(q.join('\n'), d); into.append(d);
      continue;
    }
    if (RX_LI.test(l)) { i = list(L, i, into); continue; }
    const para = [];
    while (i < L.length && L[i].trim() && !(para.length && startsBlock(L[i]))) para.push(L[i++].trim());
    into.append(inline(para.join(' '), h('div', {class: 'blk'})));
  }
  return into;
}
// A list and everything nested under it. Items deeper than the first item's
// indent become a nested list; plain indented lines continue the item.
function list(L, i, into){
  const base = RX_LI.exec(L[i])[1].length;
  const wrap = h('div', {class: 'lst'});
  let cur = null;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) {
      let j = i + 1;
      while (j < L.length && !L[j].trim()) j++;
      if (j < L.length && (L[j].match(/^\s*/)[0].length > base || (RX_LI.test(L[j]) && RX_LI.exec(L[j])[1].length === base))) { i = j; continue; }
      break;
    }
    const ind = l.match(/^\s*/)[0].length, m = RX_LI.exec(l);
    if (m && ind === base) {
      const lc = h('div', {class: 'lc'});
      inline(m[3], lc);
      cur = lc;
      wrap.append(h('div', {class: 'li'}, [h('span', {class: 'mk', text: (/\d/.test(m[2]) ? m[2] : '-') + ' '}), lc]));
      i++;
    } else if (ind > base && cur) {
      if (m) { i = list(L, i, cur); continue; }
      const sub = [];
      while (i < L.length && L[i].trim() && L[i].match(/^\s*/)[0].length > base && !RX_LI.test(L[i])) sub.push(L[i++].trim());
      cur.append(inline(sub.join(' '), h('div', {style: 'margin-top:.3em'})));
    } else if (ind < base || !m) break;
    else break;
  }
  into.append(wrap);
  return i;
}

/* ---------- comment anchors: offsets into a message body's text ---------- */
function textOffset(body, node, off){
  const r = document.createRange();
  r.setStart(body, 0); r.setEnd(node, off);
  return r.toString().length;
}
// Wrap [start, end) of body's text in <mark data-c=id>, splitting text nodes as needed.
function wrapRange(body, start, end, id){
  const w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  const hits = [];
  let pos = 0, n;
  while ((n = w.nextNode())) {
    const len = n.data.length, a = Math.max(start, pos), b = Math.min(end, pos + len);
    if (b > a) hits.push([n, a - pos, b - pos]);
    pos += len;
    if (pos >= end) break;
  }
  for (const [node, a, b] of hits) {
    let t = node;
    if (a > 0) t = t.splitText(a);
    if (b - a < t.data.length) t.splitText(b - a);
    const mk = h('mark', {'data-c': id});
    t.parentNode.replaceChild(mk, t);
    mk.append(t);
  }
}
// Where a comment lands now: its offsets if the text still matches, else the
// occurrence of its quote nearest the old start, else nowhere (shown as orphan).
function locate(text, c){
  if (c.quote && text.slice(c.start, c.end) === c.quote) return [c.start, c.end];
  if (!c.quote) return null;
  let best = -1, i = text.indexOf(c.quote);
  while (i > -1) {
    if (best < 0 || Math.abs(i - c.start) < Math.abs(best - c.start)) best = i;
    i = text.indexOf(c.quote, i + 1);
  }
  return best < 0 ? null : [best, best + c.quote.length];
}

/* ---------- feed rendering ---------- */
const feedEl = document.getElementById('feed');
let feed = null, rev = -1, comments = new Map(), pending = false;
const nodes = new Map(); // msg id -> {sig, el}

function renderMsg(m, cs){
  let el, body;
  const t = h('span', {class: 't', text: when(m.ts) + (m.edited ? ' · edited' : '')});
  if (m.kind === 'claude') {
    body = blocks(m.text, h('div', {class: 'body', 'data-id': m.id}));
    el = h('div', {class: 'm c'}, [h('span', {class: 'p', text: '⏺'}), body, t]);
  } else {
    body = h('div', {class: 'body', 'data-id': m.id, text: m.text});
    const row = h('div', {class: 'u' + (m.kind === 'note' ? ' n' : '')}, [h('span', {class: 'p', text: '>'}), body]);
    el = h('div', {class: 'm'}, [row, t]);
    if (m.kind === 'note') el.append(h('div', {class: 'res', text: '⎿  note · ' + when(m.ts)}));
  }
  const text = body.textContent, orphans = [];
  for (const c of cs) {
    const at = locate(text, c);
    if (at) wrapRange(body, at[0], at[1], c.id); else orphans.push(c);
  }
  for (const c of orphans)
    el.append(h('div', {class: 'orph'}, ['⎿  comment on text that changed: ', h('mark', {'data-c': c.id, text: c.quote || '…'})]));
  return el;
}

function busy(){
  const sel = getSelection();
  return !!(pop.dataset.edit || (sel && !sel.isCollapsed && feedEl.contains(sel.anchorNode)));
}

function render(){
  if (busy()) { pending = true; return; }
  pending = false;
  feedEl.textContent = '';
  if (!getKey()) {
    nodes.clear();
    feedEl.append(h('div', {class: 'm c'}, [h('span', {class: 'p', text: '⏺'}),
      h('div', {class: 'body'}, [h('div', {class: 'blk', text: 'Locked. Type the key below and press enter.'})])]));
    return;
  }
  if (!feed) return;
  const nearBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 140;
  const byMsg = new Map();
  comments = new Map();
  for (const c of feed.comments) {
    comments.set(String(c.id), c);
    if (!byMsg.has(c.msg)) byMsg.set(c.msg, []);
    byMsg.get(c.msg).push(c);
  }
  const seen = new Set();
  for (const m of feed.msgs) {
    const cs = byMsg.get(m.id) || [];
    const sig = m.text + '|' + m.edited + '|' + JSON.stringify(cs);
    let n = nodes.get(m.id);
    if (!n || n.sig !== sig) { n = {sig, el: renderMsg(m, cs)}; nodes.set(m.id, n); }
    feedEl.append(n.el);
    seen.add(m.id);
  }
  for (const id of [...nodes.keys()]) if (!seen.has(id)) nodes.delete(id);
  for (const s of sysLines) feedEl.append(s);
  if (!feed.msgs.length && !sysLines.length)
    feedEl.append(h('div', {class: 'sys', text: '  nothing here yet. type below, or post from Claude Code with ./cnp'}));
  if (nearBottom || firstPaint) { firstPaint = false; scrollTo(0, document.documentElement.scrollHeight); }
}
let firstPaint = true;
const sysLines = [];
function sys(text, err){
  sysLines.push(h('div', {class: 'm sys' + (err ? ' err' : ''), text: '  ' + text}));
  if (sysLines.length > 3) sysLines.shift();
  render();
}

/* ---------- polling ---------- */
const dot = document.getElementById('dot'), st = document.getElementById('st');
function status(ok, text){ dot.className = 'dot ' + (ok ? 'ok' : 'err'); st.textContent = text; }
let polling = false;
async function poll(force){
  if (!getKey()) { status(false, 'locked'); render(); return; }
  if (polling) return;
  polling = true;
  try {
    const f = await api('GET', '/feed' + (force || !feed ? '' : '?rev=' + rev));
    status(true, 'live');
    if (!f.same) { feed = f; rev = f.rev; render(); }
    else if (pending) render();
  } catch (e) {
    if (e.status === 401) { store.del(KEY); feed = null; status(false, 'locked'); sys('that key was refused. type it again.', true); }
    else status(false, 'offline');
  } finally { polling = false; }
}
setInterval(() => { if (document.visibilityState === 'visible') poll(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

/* ---------- input box ---------- */
const inp = document.getElementById('inp');
function grow(){
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, innerHeight * 0.4) + 'px';
  document.body.style.paddingBottom = (document.querySelector('.dock').offsetHeight + 16) + 'px';
}
function setMode(){
  const locked = !getKey();
  inp.classList.toggle('secret', locked);
  inp.placeholder = locked ? 'key' : 'add a note…';
  if (!locked && !inp.value) inp.value = store.get(DRAFT) || '';
  grow();
}
inp.addEventListener('input', () => { if (getKey()) store.set(DRAFT, inp.value); grow(); });
inp.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  submit();
});
async function submit(){
  const v = inp.value.trim();
  if (!v) return;
  if (!getKey()) {
    try {
      await api('GET', '/feed', null, v);
      store.set(KEY, v); inp.value = ''; setMode(); sysLines.length = 0;
      await poll(true);
    } catch (e) { sys(e.status === 401 ? 'wrong key.' : 'could not reach the worker.', true); }
    return;
  }
  if (v === '/lock') {
    store.del(KEY); store.del(DRAFT); feed = null; inp.value = ''; setMode(); render(); status(false, 'locked');
    return;
  }
  inp.value = ''; store.del(DRAFT); grow();
  try {
    await api('POST', '/msg', {kind: 'note', text: v});
    firstPaint = true;
    await poll(true);
  } catch (e) {
    inp.value = v; store.set(DRAFT, v); grow();
    sys('not saved (' + e.message + '). your text is back in the box.', true);
  }
}

/* ---------- select text -> comment ---------- */
const addc = h('button', {id: 'addc', type: 'button', text: '+ comment', hidden: true});
document.body.append(addc);
let anchor = null;
function bodyOf(n){
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  return el && el.closest('.body[data-id]');
}
function checkSel(){
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount || pop.dataset.edit) { addc.hidden = true; anchor = null; return; }
  const r = sel.getRangeAt(0), b = bodyOf(r.startContainer);
  if (!b || b !== bodyOf(r.endContainer)) { addc.hidden = true; anchor = null; return; }
  const start = textOffset(b, r.startContainer, r.startOffset), end = textOffset(b, r.endContainer, r.endOffset);
  const quote = b.textContent.slice(start, end);
  if (!quote.trim()) { addc.hidden = true; anchor = null; return; }
  anchor = {msg: Number(b.dataset.id), start, end, quote};
  const rects = r.getClientRects(), last = rects[rects.length - 1] || r.getBoundingClientRect();
  addc.hidden = false;
  const x = Math.min(last.right + scrollX - 10, scrollX + innerWidth - addc.offsetWidth - 8);
  addc.style.left = Math.max(scrollX + 8, x) + 'px';
  addc.style.top = (last.bottom + scrollY + 6) + 'px';
}
let selT = 0;
document.addEventListener('selectionchange', () => { clearTimeout(selT); selT = setTimeout(checkSel, 120); });
addc.addEventListener('mousedown', e => e.preventDefault()); // keep the selection
addc.addEventListener('click', () => {
  if (!anchor) return;
  const a = anchor, rect = getSelection().getRangeAt(0).getBoundingClientRect();
  addc.hidden = true;
  openEditor(rect, a.quote, '', async text => {
    await api('POST', '/comment', Object.assign({text}, a));
    getSelection().removeAllRanges();
  });
});

/* ---------- popover: read, edit, delete a comment ---------- */
const pop = h('div', {class: 'pop', hidden: true});
document.body.append(pop);
let hideT = 0, popFor = null;
function place(rect){
  pop.hidden = false;
  const w = pop.offsetWidth, ht = pop.offsetHeight;
  let x = Math.min(rect.left, innerWidth - w - 10), y = rect.bottom + 6;
  if (y + ht > innerHeight - 90) y = Math.max(10, rect.top - ht - 6);
  pop.style.left = Math.max(10, x) + 'px';
  pop.style.top = y + 'px';
}
function highlight(id){
  document.querySelectorAll('mark.on').forEach(m => m.classList.remove('on'));
  if (id) document.querySelectorAll('mark[data-c="' + id + '"]').forEach(m => m.classList.add('on'));
}
function hidePop(){
  if (pop.dataset.edit) return;
  pop.hidden = true; popFor = null; highlight(null);
  if (pending) render();
}
function showComment(mark){
  const c = comments.get(mark.dataset.c);
  if (!c || pop.dataset.edit) return;
  clearTimeout(hideT);
  popFor = mark.dataset.c;
  highlight(popFor);
  pop.textContent = '';
  const del = h('button', {class: 'lk', type: 'button', text: 'delete'});
  del.addEventListener('click', async () => {
    if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'really delete?'; del.classList.add('err'); return; }
    try { await api('DELETE', '/comment?id=' + c.id); hidePop(); poll(true); }
    catch (e) { del.textContent = 'failed: ' + e.message; }
  });
  const edit = h('button', {class: 'lk', type: 'button', text: 'edit'});
  edit.addEventListener('click', () => {
    const rect = mark.getBoundingClientRect();
    openEditor(rect, c.quote, c.text, text => api('PUT', '/comment?id=' + c.id, {text}));
  });
  pop.append(h('div', {class: 'txt', text: c.text}),
    h('div', {class: 'meta'}, ['c' + c.id + ' · ' + when(c.ts) + (c.edited ? ' · edited ' + when(c.edited) : '') + ' · ', edit, ' · ', del]));
  place(mark.getBoundingClientRect());
}
function openEditor(rect, quote, text, save){
  clearTimeout(hideT);
  pop.dataset.edit = '1';
  pop.textContent = '';
  const ta = h('textarea', {spellcheck: 'false', placeholder: 'comment…'});
  ta.value = text;
  const msg = h('span');
  const close = () => { delete pop.dataset.edit; pop.hidden = true; popFor = null; highlight(null); if (pending) render(); };
  const go = async () => {
    const v = ta.value.trim();
    if (!v) return;
    msg.textContent = ' saving…';
    try { await save(v); close(); poll(true); }
    catch (e) { msg.textContent = ' not saved: ' + e.message; }
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(); }
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  const ok = h('button', {class: 'lk', type: 'button', text: 'save', onclick: go});
  const no = h('button', {class: 'lk', type: 'button', text: 'cancel', onclick: close});
  pop.append(h('div', {class: 'q', text: '“' + quote.replace(/\s+/g, ' ') + '”'}), ta,
    h('div', {class: 'meta'}, ['enter save · shift+enter newline · esc · ', ok, ' · ', no, msg]));
  place(rect);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
feedEl.addEventListener('mouseover', e => {
  const mk = e.target.closest && e.target.closest('mark[data-c]');
  if (mk && mk.dataset.c !== popFor) showComment(mk);
  else if (mk) clearTimeout(hideT);
});
feedEl.addEventListener('mouseout', e => {
  if (e.target.closest && e.target.closest('mark[data-c]')) { clearTimeout(hideT); hideT = setTimeout(hidePop, 300); }
});
pop.addEventListener('mouseenter', () => clearTimeout(hideT));
pop.addEventListener('mouseleave', () => { hideT = setTimeout(hidePop, 300); });
// touch: tap a mark to open, tap elsewhere to close
document.addEventListener('click', e => {
  const mk = e.target.closest && e.target.closest('mark[data-c]');
  if (mk) { showComment(mk); return; }
  if (!pop.hidden && !pop.contains(e.target) && !pop.dataset.edit) hidePop();
});
addEventListener('resize', grow);

/* ---------- go ---------- */
setMode();
render();
poll(true).then(() => {
  if (SHOT === 'comment') {
    const mk = document.querySelector('mark[data-c="2"]');
    if (mk) showComment(mk);
  }
});
})();
</script>
<script>
/* anonymous visit beacon: counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
