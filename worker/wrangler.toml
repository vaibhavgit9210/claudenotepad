name = "claudenotepad"
main = "worker.js"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "NOTEBOOK"
class_name = "Notebook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Notebook"]

# Secret (set via `npx wrangler secret put NOTE_KEY`, never in this file):
